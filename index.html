<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet collaboratif agile</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="h-screen">
    <header class="bg-purple-800 w-full py-4 flex justify-center items-center h-[10%]">
        <div id="menuBar" class="px-6 py-3 flex flex-row items-center gap-6 text-white">
            <button id="dispBtn"
                class="menuBtn border-2 border-white rounded-xl p-1 hover:bg-white hover:text-purple-800 active:bg-purple-600">Définir
                la disposition</button>
            <button id="eleveBtn"
                class="menuBtn border-2 border-white rounded-xl p-1 hover:bg-white hover:text-purple-800 active:bg-purple-600">Saisie
                des élèves</button>
            <button id="expBtn"
                class="menuBtn border-2 border-white rounded-xl p-1 hover:bg-white hover:text-purple-800 active:bg-purple-600">Exporter</button>
        </div>
    </header>

    <main class="flex justify-center items-center p-8 h-[85%]">

        <div id="planTotal" class="w-[80%] h-[80%] bg-white border-4 border-black rounded-xl cursor-pointer flex justify-center items-center">
        </div>
    </main>
    <footer class="bg-purple-800 w-full h-[5%] py-4">

    </footer>

    <!--MENUS-->

    <div id="menuDisposition"
        class="container bg-white flex flex-col items-center w-[30%] h-auto border-4 border-black rounded-xl gap-2 absolute top-[25%] left-[34%] text-center hidden">
        <h2 class="bg-purple-800 text-white m-2 p-2 border-2 border-black text-3xl rounded-xl">Menu de création de la
            disposition des places</h2>
        <div class="flex flex-col items-center gap-3">
            <h3 class="text-2xl my-2">Donnez le nombre de rangée(s) et de place(s) par rangée.</h3>
            <div>
                <label for="nb-range">Nombre de rangée(s): </label><input type="text" id="nb-range" placeholder="Ex: 3"
                    required class="border-black border-2 w-12">

                <label for="nb-place">Nombre de place(s): </label><input type="text" id="nb-place" placeholder="Ex: 4"
                    required class="border-black border-2 w-12">
            </div>
            <p id="errNb" class="text-red-600"></p>
            <button id="afficherAp"
                class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white">Afficher
                l'aperçu</button>
        </div>
        <h3 class="text-2xl my-2">Aperçu</h3>
        <div id="apercu"
            class="border-2 border-purple-800 rounded-xl w-[80%] max-h-[30rem] overflow-auto flex flex-col justify-center items-center">
        </div>
        <button id="appPlanDisp"
            class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white my-2">Appliquer
            au plan</button>
    </div>

    <div id="menuSaisie"
        class="container bg-white flex flex-col items-center w-[30%] h-auto border-4 border-black rounded-xl gap-2 absolute top-[25%] left-[34%] text-center hidden">
        <h2 class="bg-purple-800 text-white m-2 p-2 border-2 border-black text-3xl rounded-xl">Menu de saisie des élèves
        </h2>
        <div id="saisieInd" class="flex flex-col items-center gap-3">
            <h3 class="text-2xl my-2">Donnez le nombre d'élèves à placer.</h3>
            <label for="nb-eleve">Nombre d'élèves: </label><input type="text" id="nb-eleve" placeholder="Ex: 3" required
                class="border-black border-2 w-12">
            <p id="errInd" class="text-red-600"></p>
            <button id="startSaisie"
                class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white">Commencer
                saisie individuelle</button>
        </div>
        <div id="SaisieMlt" class="container">
            <h3 class="text-2xl my-2">Saisie Multiple</h3>
            <textarea placeholder="Entrer une liste de noms séparés par des virgules. ex: Louis, Mathys, Augustin..."
                class="border-2 border-purple-800 h-[10rem] w-[80%]"></textarea>
            <p id="errMlt" class="text-red-600"></p>
        </div>
        <button id="appPlanSaisie"
            class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white my-2">Appliquer
            au plan</button>
    </div>

    <div id="export"
        class="container bg-white flex flex-col items-center w-[30%] h-auto border-4 border-black rounded-xl gap-2 absolute top-[25%] left-[34%] text-center hidden">
        <h2 class="bg-purple-800 text-white m-2 p-2 border-2 border-black text-3xl rounded-xl">Menu export</h2>
        <label for="format" class="text-2xl my-2">Selectionner le format d'export</label>
        <select id="format" class="text-xl p-2 border-2 border-purple-800 rounded-xl">
            <option value="sS">Capture d'écran</option>
            <option value="texte">Liste en texte</option>
        </select>
        <button id="exportBtn"
            class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white my-2">Exporter</button>
    </div>
    <script src="./main.js"></script>
</body>


</html>
