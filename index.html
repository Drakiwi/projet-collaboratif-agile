<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet collaboratif agile</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body>
    <header>
        <div id="menuBar">
            <button class="menuBtn">Définir la disposition</button>
            <button class="menuBtn">Saisie des élèves</button>
            <button class="menuBtn">Exporter</button>
        </div>
    </header>

    <main>
        <div id="planTotal"></div>
    </main>

    <footer>

    </footer>

    <script src="./main.js"></script>
</body>

<div id="menuDisposition" class="container bg-white flex flex-col items-center w-[30%] h-auto border-4 border-black rounded-xl gap-2 absolute top-[10%] left-[34%] text-center">
    <h2 class="bg-purple-800 text-white m-2 p-2 border-2 border-black text-3xl rounded-xl">Menu de création de la disposition des places</h2>
    <div class="flex flex-col items-center gap-3">
        <h3 class="text-2xl my-2">Donnez le nombre de rangée(s) et de place(s) par rangée.</h3>
        <div>
            <label for="nb-range">Nombre de rangée(s): </label><input type="text" id="nb-range" placeholder="Ex: 3" required class="border-black border-2 w-12">

            <label for="nb-place">Nombre de place(s): </label><input type="text" id="nb-place" placeholder="Ex: 4" required class="border-black border-2 w-12">
        </div>
        <p id="errNb" class="text-red-600"></p>
        <button id="afficherAp" class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white">Afficher l'aperçu</button>
    </div>
    <h3 class="text-2xl my-2">Aperçu</h3>
    <div id="apercu" class="border-2 border-purple-800 rounded-xl w-[80%] max-h-[30rem] overflow-auto flex flex-col justify-center items-center">
    </div>
    <button id="appPlanDisp" class="border-2 border-purple-800 rounded-xl p-1 hover:bg-green-500 active:bg-purple-800 active:text-white my-2">Appliquer au plan</button>
</div>

<div id="menuSaisie">
    <h2>Menu de saisie des élèves</h2>
    <div id="saisieInd">
        <h3>Donnez le nombre d'élèves à placer.</h3>
        <label for="nb-eleve">Nombre d'élèves: </label><input type="text" id="nb-eleve" required>
        <p id="errInd"></p>
        <button id="startSaisie">Commencer saisie</button>
    </div>
    <div id="SaisieMlt">
        <h3>Saisie Multiple</h3>
        <textarea placeholder="Entrer une liste de noms séparés par des virgules. ex: Louis, Mathys, Augustin..."></textarea>
        <p id="errMlt"></p>
    </div>
    <button id="appPlanSaisie">Appliquer au plan</button>
</div>

<div id="export">
    <h2>Menu export</h2>
    <label for="format">Selectionner le format d'export</label>
    <select id="format">
        <option value="sS">Capture d'écran</option>
        <option value="texte">Liste en texte</option>
    </select>
    <button id="exportBtn">Exporter</button>
</div>



</html>
